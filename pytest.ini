# ====================================================================
# Configuration de pytest (l'outil qui execute les tests)
# ====================================================================
# testpaths = ou pytest doit chercher les tests quand on tape
# simplement "pytest" a la racine du depot. Sans cette ligne, il
# scannerait tout le projet (plus lent, et risque de ramasser des
# fichiers qui ne sont pas des tests).
[pytest]
testpaths = tests
